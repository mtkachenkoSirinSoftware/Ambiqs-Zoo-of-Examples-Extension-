# NSX manifest for kws_clip. Board modules come from the apollo510_evb
# starter profile. helia-rt 1.19.0 / ns-cmsis-nn 7.31.0 — not the
# kws_infer README pair (1.16.0 / 7.29.2).
schema_version: 2

project:
  name: kws_clip

targets:
  default: apollo510_evb
  supported:
    - apollo510_evb

toolchain: arm-none-eabi-gcc
channel: stable

modules:
  - nsx-power
  - nsx-pmu-armv8m
  - name: nsx-cmsis-nn
    project: ns-cmsis-nn
    revision: b386770a4588e2b46a6ca6df97fa487c9f3dedd4
  - name: nsx-helia-rt
    project: helia-rt
    revision: cfab1523a58bcfab69a106efea22c530b8100285

module_registry:
  projects:
    ns-cmsis-nn:
      url: https://github.com/AmbiqAI/ns-cmsis-nn.git
      revision: b386770a4588e2b46a6ca6df97fa487c9f3dedd4
    helia-rt:
      url: https://github.com/AmbiqAI/helia-rt.git
      revision: cfab1523a58bcfab69a106efea22c530b8100285
  modules:
    nsx-cmsis-nn:
      project: ns-cmsis-nn
      revision: b386770a4588e2b46a6ca6df97fa487c9f3dedd4
    nsx-helia-rt:
      project: helia-rt
      revision: cfab1523a58bcfab69a106efea22c530b8100285

features: {}
