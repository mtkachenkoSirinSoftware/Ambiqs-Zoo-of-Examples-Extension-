# NSX manifest for kws_uart. Pins match kws_clip (helia-rt 1.19.0 /
# ns-cmsis-nn 7.31.0), not kws_infer registry defaults.
schema_version: 2

project:
  name: kws_uart

targets:
  default: apollo510_evb
  supported:
    - apollo510_evb

toolchain: arm-none-eabi-gcc
channel: stable

modules:
  - nsx-power
  - nsx-ambiq-usb
  - nsx-usb
  - nsx-timer
  - nsx-interrupt
  - nsx-nanopb
  - name: nsx-cmsis-nn
    project: ns-cmsis-nn
    revision: b386770a4588e2b46a6ca6df97fa487c9f3dedd4
  - name: nsx-helia-rt
    project: helia-rt
    revision: cfab1523a58bcfab69a106efea22c530b8100285

module_registry:
  projects:
    ns-cmsis-nn:
      url: https://github.com/AmbiqAI/ns-cmsis-nn.git
      revision: b386770a4588e2b46a6ca6df97fa487c9f3dedd4
    helia-rt:
      url: https://github.com/AmbiqAI/helia-rt.git
      revision: cfab1523a58bcfab69a106efea22c530b8100285
    nsx-nanopb:
      url: https://github.com/AmbiqAI/nsx-nanopb.git
      revision: v0.1.1
  modules:
    nsx-cmsis-nn:
      project: ns-cmsis-nn
      revision: b386770a4588e2b46a6ca6df97fa487c9f3dedd4
    nsx-helia-rt:
      project: helia-rt
      revision: cfab1523a58bcfab69a106efea22c530b8100285
    nsx-nanopb:
      project: nsx-nanopb
      revision: v0.1.1
      metadata: modules/nsx-nanopb/nsx-module.yaml

features: {}
